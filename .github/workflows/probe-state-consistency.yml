name: Probe metadata consistency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CRASHLYTICS_ENV: ${{ secrets.CRASHLYTICS_ENV }}
      CRASHLYTICS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CRASHLYTICS_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Probe isolated non-branch metadata with actual App credentials
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from unittest.mock import patch
          import requests
          from crashlytics_automation.worker import runtime_config
          runtime_config()
          from crashlytics_automation.github import create_github
          from crashlytics_automation import investigation_jobs
          from crashlytics_automation.repository import REPOSITORY_PATH, STATE_REFERENCE
          from crashlytics_automation.task_payloads import parse_alert_payload

          class TraceSession(requests.Session):
              def request(self, method, url, **kwargs):
                  response = super().request(method, url, **kwargs)
                  body = response.json() if response.status_code != 204 else {}
                  detail = {'method': method, 'path': url.removeprefix('https://api.github.com'),
                            'status': response.status_code}
                  if isinstance(body, dict):
                      detail['sha'] = body.get('sha') or (body.get('object') or {}).get('sha')
                      if isinstance(body.get('tree'), list):
                          detail['jobs'] = {item['path']: item['sha'] for item in body['tree']
                                            if item.get('type') == 'blob' and item['path'].startswith('jobs/')}
                  print(json.dumps(detail), flush=True)
                  return response

          github = create_github(
              os.environ['CRASHLYTICS_GITHUB_APP_ID'], os.environ['CRASHLYTICS_GITHUB_INSTALLATION_ID'],
              os.environ['CRASHLYTICS_GITHUB_APP_PRIVATE_KEY'], permissions={'contents': 'write'},
              session=TraceSession(),
          )
          head = github.rest('GET', REPOSITORY_PATH + '/git/ref/' + STATE_REFERENCE.removeprefix('refs/'))['object']['sha']
          probe = 'refs/automation/consistency-probe-' + os.environ['GITHUB_RUN_ID']
          github.rest('POST', REPOSITORY_PATH + '/git/refs', {'ref': probe, 'sha': head})
          try:
              entries = github.rest('GET', REPOSITORY_PATH + '/git/trees/' + head + '?recursive=1')['tree']
              path = 'jobs/512ac5b6c09e2591aea9344697da891ad80d9736643a70ed9cc6ffece07a2e42.json'
              sha = next(entry['sha'] for entry in entries if entry['path'] == path)
              blob = github.rest('GET', REPOSITORY_PATH + '/git/blobs/' + sha)
              state = json.loads(base64.b64decode(blob['content']))
              with patch.object(investigation_jobs, 'STATE_REFERENCE', probe):
                  queue = investigation_jobs.InvestigationQueue(github)
                  job = queue.get(parse_alert_payload(state['alert']))
                  for step in range(3):
                      job['reason'] = 'Isolated consistency probe ' + str(step)
                      queue.put(job)
                      print('Committed isolated write ' + str(step), flush=True)
                  assert queue.get(parse_alert_payload(state['alert']))['reason'] == 'Isolated consistency probe 2'
              print('App metadata read/write consistency probe passed', flush=True)
          finally:
              github.rest('DELETE', REPOSITORY_PATH + '/git/refs/' + probe.removeprefix('refs/'))
          PY
      - name: Verify official token count without model generation
        if: always()
        env:
          CRASHLYTICS_OPENAI_API_KEY: ${{ secrets.CRASHLYTICS_OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          from crashlytics_automation.worker import runtime_config
          runtime_config()
          from crashlytics_automation.openai_client import DEFAULT_MODEL, RUN_COMMAND, RUN_EXPERIMENT, RESPONSE_SCHEMA
          payload = {
              'model': os.environ.get('OPENAI_MODEL', DEFAULT_MODEL),
              'input': [{'role': 'user', 'content': 'Count tokens only.'}],
              'tools': [RUN_COMMAND, RUN_EXPERIMENT], 'tool_choice': 'auto', 'parallel_tool_calls': False,
              'text': {'format': {'type': 'json_schema', 'name': 'crashlytics_investigation',
                                  'strict': True, 'schema': RESPONSE_SCHEMA}},
          }
          response = requests.post('https://api.openai.com/v1/responses/input_tokens', json=payload,
                                   headers={'Authorization': 'Bearer ' + os.environ['CRASHLYTICS_OPENAI_API_KEY']},
                                   timeout=30, allow_redirects=False)
          if response.status_code != 200:
              raise RuntimeError('Token counter HTTP ' + str(response.status_code))
          result = response.json()
          if result.get('object') != 'response.input_tokens' or type(result.get('input_tokens')) is not int:
              raise RuntimeError('Invalid token counter response')
          print('Official input token counter passed: ' + str(result['input_tokens']))
          PY
