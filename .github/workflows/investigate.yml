name: Investigate Crashlytics

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing Android Crashlytics issue to investigate; empty processes the oldest queued incident
        type: string
        required: false
      resume_manual:
        description: Resume a manual source investigation from saved evidence, without a new capture
        type: boolean
        default: false
      allow_extra_attempt:
        description: Explicitly authorize one extra investigation for the exhausted current lane; keep saved evidence and counters
        type: boolean
        default: false
      verification_only:
        description: Re-verify and publish a saved proposal without a model call
        type: boolean
        default: false
      notes:
        description: Additional research to verify; stored with the saved investigation state
        type: string
        required: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && (inputs.issue_number != '' || inputs.resume_manual || inputs.allow_extra_attempt || inputs.verification_only || inputs.notes != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CRASHLYTICS_ENV: ${{ secrets.CRASHLYTICS_ENV }}
      CRASHLYTICS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CRASHLYTICS_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - name: Checkout trusted request handler
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install request dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      - name: Authenticate capture delivery
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Persist the explicit request before waiting for the worker
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RESUME_MANUAL: ${{ inputs.resume_manual }}
          ALLOW_EXTRA_ATTEMPT: ${{ inputs.allow_extra_attempt }}
          INVESTIGATION_NOTES: ${{ inputs.notes }}
          VERIFICATION_ONLY: ${{ inputs.verification_only }}
        run: |
          args=()
          if [[ -n "$ISSUE_NUMBER" ]]; then
            args+=(--issue-number "$ISSUE_NUMBER")
          fi
          if [[ "$RESUME_MANUAL" == 'true' ]]; then
            args+=(--resume-manual)
          fi
          if [[ "$ALLOW_EXTRA_ATTEMPT" == 'true' ]]; then
            args+=(--allow-extra-attempt)
          fi
          if [[ "$VERIFICATION_ONLY" == 'true' ]]; then
            args+=(--verification-only)
          fi
          python -m crashlytics_automation.worker --list-pending "${args[@]}"

  investigate:
    needs: prepare
    permissions:
      contents: read
      actions: write
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    concurrency:
      group: crashlytics-investigation-worker
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CRASHLYTICS_ENV: ${{ secrets.CRASHLYTICS_ENV }}
      CRASHLYTICS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CRASHLYTICS_GITHUB_APP_PRIVATE_KEY }}
      INVESTIGATION_IMAGE: crashlytics-investigator:${{ github.run_id }}
    steps:
      - name: Checkout trusted worker
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install trusted worker dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      - name: Authenticate merge task delivery
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Find or capture the requested investigation
        id: queue
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          VERIFICATION_ONLY: ${{ inputs.verification_only }}
        run: |
          args=()
          if [[ -n "$ISSUE_NUMBER" ]]; then
            args+=(--issue-number "$ISSUE_NUMBER")
          fi
          if [[ "$VERIFICATION_ONLY" == 'true' ]]; then
            args+=(--verification-only)
          fi
          python -m crashlytics_automation.worker --list-pending "${args[@]}"

      - name: Set up Android tooling Java
        if: steps.queue.outputs.needs_sandbox == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        if: steps.queue.outputs.needs_sandbox == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install isolated Android reproduction prerequisites
        if: steps.queue.outputs.needs_sandbox == 'true'
        run: |
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-34;google_apis;x86_64'
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Build credential-free investigation image
        if: steps.queue.outputs.needs_sandbox == 'true'
        run: |
          context=$(mktemp -d)
          docker build --file "$GITHUB_WORKSPACE/Dockerfile.investigation" --tag "$INVESTIGATION_IMAGE" "$context"

      - name: Investigate once, verify and publish both target PRs
        id: execute
        if: steps.queue.outputs.pending == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.queue.outputs.issue_number }}
          CRASHLYTICS_OPENAI_API_KEY: ${{ !inputs.verification_only && secrets.CRASHLYTICS_OPENAI_API_KEY || '' }}
          INVESTIGATION_ARTIFACTS: ${{ runner.temp }}/crashlytics-artifacts
          VERIFICATION_ONLY: ${{ inputs.verification_only }}
        run: |
          args=(--issue-number "$ISSUE_NUMBER")
          if [[ "$VERIFICATION_ONLY" == 'true' ]]; then
            args+=(--verification-only)
          fi
          python -m crashlytics_automation.worker "${args[@]}"

      - name: Find remaining incident work
        if: success() && steps.execute.outcome == 'success'
        id: remaining
        run: python -m crashlytics_automation.worker --list-pending

      - name: Continue queued investigations automatically
        if: success() && steps.remaining.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/investigate.yml/dispatches" \
            -f ref=main

      - name: Upload public-repository reproduction artifacts
        if: always() && steps.queue.outputs.pending == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crashlytics-investigation-${{ github.run_id }}
          path: ${{ runner.temp }}/crashlytics-artifacts/**
          if-no-files-found: ignore
          retention-days: 7
