name: Verify crash state access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CRASHLYTICS_ENV: ${{ secrets.CRASHLYTICS_ENV }}
      CRASHLYTICS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CRASHLYTICS_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install trusted authentication dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Check existing installation access without changing permissions or state
        run: |
          python - <<'PY'
          import os
          import time
          import jwt
          import requests
          from crashlytics_automation.worker import runtime_config

          runtime_config()
          from crashlytics_automation.repository import OWNER, REPO
          repositories = [REPO]
          now = int(time.time())
          app_jwt = jwt.encode(
              {'iat': now - 60, 'exp': now + 600, 'iss': os.environ['CRASHLYTICS_GITHUB_APP_ID']},
              os.environ['CRASHLYTICS_GITHUB_APP_PRIVATE_KEY'].replace('\\n', '\n'), algorithm='RS256',
          )
          response = requests.post(
              'https://api.github.com/app/installations/' + os.environ['CRASHLYTICS_GITHUB_INSTALLATION_ID'] + '/access_tokens',
              headers={'Authorization': 'Bearer ' + app_jwt, 'Accept': 'application/vnd.github+json'},
              json={'repositories': repositories, 'permissions': {'contents': 'write'}},
              timeout=30, allow_redirects=False,
          )
          if response.status_code != 201:
              raise RuntimeError('Existing installation cannot issue the required repository scope (HTTP ' + str(response.status_code) + ')')
          token = response.json()['token']
          listed = requests.get(
              'https://api.github.com/installation/repositories',
              headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'},
              timeout=30, allow_redirects=False,
          )
          listed.raise_for_status()
          available = {item['full_name'] for item in listed.json()['repositories']}
          expected = {OWNER + '/' + REPO}
          if available != expected:
              raise RuntimeError('Existing installation must remain scoped to the application repository')
          print('Confirmed existing contents:write access: ' + ', '.join(sorted(expected)))
          PY
