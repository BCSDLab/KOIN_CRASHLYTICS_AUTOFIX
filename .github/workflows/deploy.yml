name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firebase Functions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: |
          python -m venv venv
          venv/bin/pip install --disable-pip-version-check --require-hashes -r requirements.txt

      - name: Verify investigation regressions
        run: |
          docker run --rm --network none -v "$PWD/.github/workflows:/work/.github/workflows:ro" \
            -w /work rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -shellcheck= -pyflakes= .github/workflows/*.yml
          venv/bin/pip install --disable-pip-version-check --require-hashes -r requirements-test.txt
          venv/bin/python -m pytest -q tests

      - name: Verify existing state repository access
        env:
          CRASHLYTICS_ENV: ${{ secrets.CRASHLYTICS_ENV }}
          CRASHLYTICS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CRASHLYTICS_GITHUB_APP_PRIVATE_KEY }}
        run: |
          venv/bin/python - <<'PY'
          from crashlytics_automation.worker import runtime_config, worker_github
          runtime_config()
          from crashlytics_automation.github import GitHubError
          from crashlytics_automation.repository import STATE_REPOSITORY_PATH, STATE_REFERENCE
          github = worker_github()
          try:
              github.rest('GET', STATE_REPOSITORY_PATH + '/git/ref/' + STATE_REFERENCE.removeprefix('refs/'))
          except GitHubError as error:
              if error.status != 404:
                  raise
          print('Existing application and metadata repository access verified')
          PY

      - name: Write runtime configuration
        env:
          CRASHLYTICS_ENV: ${{ secrets.CRASHLYTICS_ENV }}
        run: |
          venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          config = os.environ["CRASHLYTICS_ENV"]
          settings = dict(
              line.split("=", 1) for line in config.splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          )
          project = settings["CRASHLYTICS_PROJECT_ID"].strip()
          Path(f".env.{project}").write_text(config, encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"GOOGLE_CLOUD_PROJECT={project}\n")
              output.write(f"GOOGLE_CLOUD_QUOTA_PROJECT={project}\n")
              output.write(f"AUTOMATION_SERVICE_ACCOUNT={settings['AUTOMATION_SERVICE_ACCOUNT'].strip()}\n")
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}

      - name: Set up task delivery IAM tooling
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Register runtime secrets and deploy
        env:
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CRASHLYTICS_GITHUB_APP_PRIVATE_KEY }}
        run: |
          printf '%s' "$GITHUB_APP_PRIVATE_KEY" | npx --yes firebase-tools@15.35.0 functions:secrets:set CRASHLYTICS_GITHUB_APP_PRIVATE_KEY --data-file - --project "$GOOGLE_CLOUD_PROJECT" --non-interactive
          npx --yes firebase-tools@15.35.0 deploy --only functions:crashlytics-issues --project "$GOOGLE_CLOUD_PROJECT" --non-interactive

      - name: Preserve private pipeline invocation and worker task delivery
        run: |
          set -euo pipefail
          for service in crashlyticsnewfatal crashlyticsnewnonfatal crashlyticsnewanr crashlyticsregression crashlyticsvelocity; do
            gcloud run services add-iam-policy-binding "$service" --region us-east1 \
              --member="serviceAccount:$AUTOMATION_SERVICE_ACCOUNT" --role=roles/run.invoker --quiet
          done
          for service in generatecrashlyticsfix mergecrashlyticsfix; do
            gcloud run services add-iam-policy-binding "$service" --region us-central1 \
              --member="serviceAccount:$AUTOMATION_SERVICE_ACCOUNT" --role=roles/run.invoker --quiet
          done
          deployer=$(gcloud config get-value account)
          changed=false
          for queue in generateCrashlyticsFix mergeCrashlyticsFix; do
            for principal in "$AUTOMATION_SERVICE_ACCOUNT" "$deployer"; do
              role=$(gcloud tasks queues get-iam-policy "$queue" --location us-central1 \
                --flatten='bindings[].members' \
                --filter="bindings.role=roles/cloudtasks.enqueuer AND bindings.members=serviceAccount:$principal" \
                --format='value(bindings.role)')
              if [[ "$role" != roles/cloudtasks.enqueuer ]]; then
                gcloud tasks queues add-iam-policy-binding "$queue" --location us-central1 \
                  --member="serviceAccount:$principal" --role=roles/cloudtasks.enqueuer --quiet
                changed=true
              fi
            done
          done
          if [[ "$changed" == true ]]; then
            sleep 120
          fi
