name: Restore completed crash proposal

on:
  workflow_dispatch:
    inputs:
      proposal_b64:
        description: Completed proposal recovered from run 45569877798 (no model call)
        required: true
        type: string

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CRASHLYTICS_ENV: ${{ secrets.CRASHLYTICS_ENV }}
      CRASHLYTICS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CRASHLYTICS_GITHUB_APP_PRIVATE_KEY }}
      PROPOSAL_B64: ${{ inputs.proposal_b64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install trusted dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Restore complete proposal without resetting counters or scheduling investigation
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from crashlytics_automation.candidate import identity_hash_for, validate_candidate
          from crashlytics_automation.github import create_github
          from crashlytics_automation.investigation_jobs import InvestigationQueue
          from crashlytics_automation.openai_client import _normalize_decision
          from crashlytics_automation.repository import REPOSITORY_PATH
          from crashlytics_automation.worker import runtime_config

          runtime_config()
          github = create_github(
              os.environ['CRASHLYTICS_GITHUB_APP_ID'],
              os.environ['CRASHLYTICS_GITHUB_INSTALLATION_ID'],
              os.environ['CRASHLYTICS_GITHUB_APP_PRIVATE_KEY'].replace('\\n', '\n'),
              permissions={'contents': 'write'},
          )
          identity = '512ac5b6c09e2591aea9344697da891ad80d9736643a70ed9cc6ffece07a2e42'
          origin = '41071baf8465e0083f156da61a80b30296c63715'
          queue = InvestigationQueue(github)
          entries = queue._entries(queue._head())
          job = queue._read(identity, entries['jobs/' + identity + '.json'])
          if (job['issueNumber'] != 1789 or job['status'] != 'manual' or
                  job.get('releaseSha') != origin or job.get('branches') or
                  job.get('attempts') != {'production': 4} or
                  job.get('attemptLimits') != {'production': 4}):
              raise RuntimeError('Saved case changed; refusing restoration')
          head = github.rest('GET', REPOSITORY_PATH + '/git/ref/heads/production')['object']['sha']
          if head != origin:
              raise RuntimeError('Production moved; refusing stale restored proposal')
          raw = base64.b64decode(os.environ['PROPOSAL_B64'], validate=True)
          if len(raw) > 45000:
              raise RuntimeError('Restored proposal exceeds dispatch bound')
          if hashlib.sha256(raw).hexdigest() != '74f539eee872cacd5a983f5a19b6e8d27d1091d424d84b9554e8ff27339f9c9d':
              raise RuntimeError('Restored payload differs from the preserved candidate')
          decision = _normalize_decision(json.loads(raw))
          source = 'feature/banner/src/main/java/in/koreatech/koin/feature/banner/component/BannerImage.kt'
          test = 'feature/banner/src/androidTest/java/in/koreatech/koin/feature/banner/component/CrashlyticsRegressiona9a611a788d7Test.kt'
          if (decision['decision'] != 'fix' or decision['sourcePath'] != source or
                  decision['sourceLine'] != 60 or
                  {item['path'] for item in decision['files']} != {source, test} or
                  len(decision['files']) != 2):
              raise RuntimeError('Restored proposal does not match completed investigation')
          commit = github.rest('GET', REPOSITORY_PATH + '/git/commits/' + origin)
          tree = github.rest('GET', REPOSITORY_PATH + '/git/trees/' + commit['tree']['sha'] + '?recursive=1')
          if tree.get('truncated'):
              raise RuntimeError('Cannot validate incomplete source tree')
          paths = {item['path']: item for item in tree['tree']}
          if test in paths or paths[source].get('mode') != '100644':
              raise RuntimeError('Unexpected pristine source/test paths')
          blob = github.rest('GET', REPOSITORY_PATH + '/git/blobs/' + paths[source]['sha'])
          baseline = base64.b64decode(blob['content']).decode('utf-8')
          candidate = validate_candidate(
              decision['files'], {source: baseline},
              identity_hash_for('0250620e4e9c331c7a8aa39c9f9f1454', origin),
          )
          if not candidate['valid']:
              raise RuntimeError(candidate['reason'])
          decision['files'] = candidate['files']
          queue.save_proposal(job, 'production', decision,
                              release_sha=origin, branch_base_sha=origin, base_sha=origin)
          restored = queue.get_proposal(job, 'production')
          if restored is None:
              raise RuntimeError('Restored proposal is not reachable')
          print('Restored completed proposal from run45569877798; SHA256=' + hashlib.sha256(raw).hexdigest())
          print('Model attempts/limit retained at4; status remains manual; no model/BQ invocation')
          PY
