name: Crashlytics operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read state, repair private worker invocation, or run one existing task
        type: choice
        options: [inspect, repair, retry, logs]
        default: inspect
        required: true
      task_id:
        description: Existing generateCrashlyticsFix task ID; required only for retry
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: crashlytics-operations
  cancel-in-progress: false

jobs:
  operate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDSDK_CORE_PROJECT: kap-chat
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      REGION: us-central1
      RUNTIME_ACCOUNT: crashlytics-autofix@kap-chat.iam.gserviceaccount.com
      OPERATION: ${{ inputs.operation }}
      TASK_ID: ${{ inputs.task_id }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: kap-chat

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Temporarily authorize task inspection or execution on the generation queue
        if: inputs.operation == 'inspect' || inputs.operation == 'retry'
        id: task_access
        shell: bash
        run: |
          set -euo pipefail
          member="serviceAccount:$(gcloud config get-value account)"
          echo "member=$member" >> "$GITHUB_OUTPUT"
          policy=$(gcloud tasks queues get-iam-policy generateCrashlyticsFix --location "$REGION" --format=json)
          roles=(roles/cloudtasks.viewer)
          if [[ "$OPERATION" == retry ]]; then
            [[ "$TASK_ID" =~ ^[a-f0-9]{64}$ ]] || { echo 'Expected an existing SHA-256 task ID'; exit 1; }
            roles+=(roles/cloudtasks.taskRunner)
          fi
          added=()
          for role in "${roles[@]}"; do
            if ! jq -e --arg role "$role" --arg member "$member" \
              '[.bindings[]? | select(.role == $role) | .members[]?] | index($member) != null' \
              <<< "$policy" > /dev/null; then
              gcloud tasks queues add-iam-policy-binding generateCrashlyticsFix --location "$REGION" \
                --member="$member" --role="$role" --format=json
              added+=("$role")
              echo "added_roles=${added[*]}" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Inspect worker invocation and queued tasks
        if: inputs.operation == 'inspect'
        shell: bash
        run: |
          set -euo pipefail
          for function in generateCrashlyticsFix mergeCrashlyticsFix; do
            gcloud functions describe "$function" --gen2 --region "$REGION" \
              --format='json(serviceConfig.serviceAccountEmail,serviceConfig.uri)'
          done
          gcloud tasks list --queue generateCrashlyticsFix --location "$REGION" \
            --format='json(name,httpRequest.url,httpRequest.oidcToken,dispatchCount,responseCount,lastAttempt,scheduleTime)'
          for service in generatecrashlyticsfix mergecrashlyticsfix; do
            gcloud run services get-iam-policy "$service" --region "$REGION" --format=json
          done

      - name: Grant private worker invocation to the runtime account
        if: inputs.operation == 'repair'
        shell: bash
        run: |
          set -euo pipefail
          for service in generatecrashlyticsfix mergecrashlyticsfix; do
            gcloud run services add-iam-policy-binding "$service" --region "$REGION" \
              --member="serviceAccount:$RUNTIME_ACCOUNT" --role=roles/run.invoker \
              --format=json
          done

      - name: Run exactly one existing generation task
        if: inputs.operation == 'retry'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TASK_ID" =~ ^[a-f0-9]{64}$ ]] || { echo 'Expected an existing SHA-256 task ID'; exit 1; }
          task=$(gcloud tasks describe "$TASK_ID" --queue generateCrashlyticsFix \
            --location "$REGION" --format=json)
          account=$(jq -r '.httpRequest.oidcToken.serviceAccountEmail' <<< "$task")
          url=$(jq -r '.httpRequest.url' <<< "$task")
          [[ "$account" == "$RUNTIME_ACCOUNT" ]]
          [[ "$url" == 'https://us-central1-kap-chat.cloudfunctions.net/generateCrashlyticsFix' ]]
          gcloud tasks run "$TASK_ID" --queue generateCrashlyticsFix --location "$REGION" \
            --format='json(name,dispatchCount,responseCount,lastAttempt,scheduleTime)'

      - name: Read recent worker logs without querying BigQuery
        if: inputs.operation == 'logs'
        shell: bash
        run: |
          set -euo pipefail
          since=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.location=\"us-central1\" AND (resource.labels.service_name=\"generatecrashlyticsfix\" OR resource.labels.service_name=\"mergecrashlyticsfix\") AND timestamp>=\"$since\"" \
            --limit=80 --order=asc \
            --format='json(timestamp,severity,textPayload,jsonPayload,httpRequest,trace,resource.labels.service_name)'

      - name: Remove only task permissions temporarily added by this run
        if: always() && steps.task_access.outputs.added_roles != ''
        env:
          MEMBER: ${{ steps.task_access.outputs.member }}
          ADDED_ROLES: ${{ steps.task_access.outputs.added_roles }}
        shell: bash
        run: |
          set -euo pipefail
          for role in $ADDED_ROLES; do
            gcloud tasks queues remove-iam-policy-binding generateCrashlyticsFix --location "$REGION" \
              --member="$MEMBER" --role="$role" --format=json
          done
